name: spritecraft
description: "An AI pixel art generator and editor"

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  equatable: ^3.0.0
  firebase_ai: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_remote_config: ^7.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  flutter_secure_storage: ^10.3.4
  gal: ^2.3.3
  go_router: ^17.0.0
  google_fonts: ^6.3.0
  image_background_remover: ^2.0.1
  intl: any
  logger: ^2.8.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  riverpod_annotation: ^4.0.0
  share_plus: ^12.0.2


dev_dependencies:
  build_runner: ^2.7.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
